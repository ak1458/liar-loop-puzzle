<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Level 2: The Liar Loop - An argumentative love test">
    <meta name="theme-color" content="#fff3f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a0a10" media="(prefers-color-scheme: dark)">
    <title>Wait... really?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <header class="topbar">
        <span class="brand">the final question</span>
        <span class="tally" id="tally" aria-live="polite">No has escaped <b id="tallyCount">0</b> times</span>
    </header>

    <main class="playground" id="playground">
        <!-- "Thinking" sticker for the initial state -->
        <figure class="sticker" aria-hidden="true">
            <div class="sticker-frame">
                <iframe src="https://tenor.com/embed/10532535631716456360" tabindex="-1" title="Thinking sticker"></iframe>
            </div>
            <figcaption>I need to know the truth</figcaption>
        </figure>

        <div class="copy">
            <h1 class="question" id="question">Do you <em>love</em> me? <span class="aside">Be honest.</span></h1>
            <p class="hint" id="hint">There is only one right answer...</p>
        </div>

        <div class="button-container">
            <button class="btn-yes" id="btnYes" aria-label="Answer Yes">Yes! 💖</button>
            <button class="btn-no" id="btnNo" aria-label="Answer No">No</button>
        </div>
    </main>

    <!-- Modal Overlay (controlled by JS state machine, no close button so you have to play along) -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">
                <!-- Iframes will be injected here -->
            </div>

            <h2 class="modal-title" id="modalTitle">...</h2>
            <p class="modal-message" id="modalMessage">...</p>

            <div class="modal-buttons" id="modalButtons">
                <button class="modal-button" id="modalActionBtn">Next</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
